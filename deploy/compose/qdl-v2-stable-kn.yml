        max-file: '3'
        max-size: 50m
    volumes:
    - type: bind
      source: ${QDL_TLS_KAFKA_DIR:?set QDL_TLS_KAFKA_DIR}
      target: /etc/kafka/secrets
      read_only: true
    - type: volume
      source: kafka1_data
      target: /var/lib/kafka/data
      read_only: false
    networks:
      stable_internal: {}
    healthcheck:
      test:
      - CMD-SHELL
      - timeout 2 bash -c '</dev/tcp/127.0.0.1/9092'
      interval: 15s
