# Data Layer V2 production KN topology - versioned compose (rendered by scripts/kn_versioned_compose.py).
#
# One file for the 17 runtime roles of project qdl_v2_stable_candidate, rendered from the live docker inspect of
# 2026-10-19T08:48:21Z and proven equal to it by `scripts/kn_versioned_compose.py parity` (intended deltas: see
# INTENDED_DELTAS in that script). Variables:
#   images + host paths  deploy/compose/qdl-v2-stable-kn.v<release>.env   (committed, no secret)
#   mesh TLS generation  <tls root>/<generation>/generation.env            (scripts/rotate_mesh_tls.py)
#   env-only secrets     ~/.local/state/qdl-v2/releases/<release>/kn-secrets.env (0600, host only)
#
# Apply ONLY per role and only inside an approved window:
#   docker compose -p qdl_v2_stable_candidate -f deploy/compose/qdl-v2-stable-kn.yml \
#     --env-file <release env> --env-file <generation.env> --env-file <secrets env> up -d --no-deps <service>
# Never a project-wide `up`, never `--remove-orphans` (the exited one-shot init containers share the project), and
# never recreate market_cache or stable_redis for a certificate change (both are ephemeral caches: CLAUDE.md 4.4).
name: qdl_v2_stable_candidate
networks:
  stable_internal:
    name: qdl_v2_stable_candidate_stable_internal
    external: true
  stable_egress:
    name: qdl_v2_stable_candidate_stable_egress
    external: true
  kn_consumer:
    name: qdl_v2_native_consumer
    external: true
  executor_network:
    name: executor_network
    external: true
volumes:
  kafka1_data:
    name: qdl_v2_stable_candidate_kafka1_data
    external: true
  kafka2_data:
    name: qdl_v2_stable_candidate_kafka2_data
    external: true
  kafka3_data:
    name: qdl_v2_stable_candidate_kafka3_data
    external: true
  stable_state:
    name: qdl_v2_stable_candidate_stable_state
    external: true
services:
  kafka1:
    image: ${QDL_IMAGE_KAFKA:?set QDL_IMAGE_KAFKA}
    pull_policy: never
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka1:9092
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: 'false'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      KAFKA_LISTENERS: CONTROLLER://:9093,SSL://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,SSL:SSL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: '86400000'
      KAFKA_LOG_SEGMENT_BYTES: '16777216'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NODE_ID: '1'
      KAFKA_NUM_PARTITIONS: '6'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.3,TLSv1.2
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
      KAFKA_SSL_KEYSTORE_CREDENTIALS: store.password
      KAFKA_SSL_KEYSTORE_FILENAME: kafka1.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEY_CREDENTIALS: key.password
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=([^,]+).*$$/$$1/,DEFAULT
      KAFKA_SSL_PROTOCOL: TLSv1.3
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.jks
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SUPER_USERS: User:phase8-admin;User:kafka1;User:kafka2;User:kafka3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
    cpus: 2.25
    mem_limit: 1610612736
    memswap_limit: 3221225472
    read_only: false
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,nosuid,nodev,exec,size=32m
    logging:
      driver: json-file
