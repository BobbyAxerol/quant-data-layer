# Only reviewed classes become DECLARED. All other paper Compose deployments
# are still represented in the generated inventory as PROFILE_REVIEW_REQUIRED.
declarations:
  adaptive_hma_cpp:
    profile: directional_bar
    min_bars: 400
    paired_okx_probe: true
    config:
      path: alphas/adaptive_hma_cpp/strategy.yaml
      maxlen_selector: ADAPTIVEHMA001.maxlen
  scalping_purely:
    profile: multi_symbol_bar
    min_bars: 200
    paired_okx_probe: true
    config:
      path: alphas/scalping_purely/config.yaml
      maxlen_selector: SCALPINGPURELY001.maxlen
  fib_sl_tp_strength:
    profile: bracket_context
    min_bars: 560
    paired_okx_probe: true
    config:
      path: alphas/fib_sl_tp_strength/strategy.yaml
      maxlen_selector: FIBSLTPSTRENGTH001.maxlen
      symbols_selector: FIBSLTPSTRENGTH001.symbols_{interval}
      symbols_suffix: USDT
  dynamic_grid:
    profile: grid_l2
    min_bars: 100
    paired_okx_probe: true
    config:
      path: alphas/dynamic_grid/strategy.yaml
      maxlen_selector: '{alpha_id}.maxlen'
      symbols_selector: '{alpha_id}.symbol'
  regressionportfolioA001_5m:
    profile: multi_symbol_bar
    min_bars: 100
    paired_okx_probe: true
    config:
      path: alphas/regressionportfolioA001_5m/strategy.yaml
      maxlen_selector: regressionportfolioA001_5m.maxlen
  e2e_probe:
    profile: directional_bar
    min_bars: 100
    paired_okx_probe: true
    config:
      path: alphas/e2e_probe/strategy.yaml
      maxlen_selector: E2EPROBE001.maxlen
  basis_arb_binance:
    profile: basis_reference
    min_bars: 365
    paired_okx_probe: true
    # Keep the paired proof native. OKX Swap has no native dated-contract
    # basis, certified daily OI, public global/top ratio, or taker-flow series
    # equivalent to this Binance profile. They remain explicit unavailable
    # routes rather than being approximated or borrowed cross-venue.
    paired_okx_optional_reference_feeds:
      - BASIS
      - LONG_SHORT_RATIO
      - OPEN_INTEREST
      - TAKER_FLOW
    primary_provider: binance
    config:
      path: alphas/basis_arb_binance/config/deployment.paper.json
      interval_selector: data.interval
      symbols_selector: data.perp_symbol
      maxlen_selector: runtime.history_cache_rows
