services:
  rust_core:
    environment:
      QDL_PROVIDER_ADMISSION_ENABLED: "true"
      QDL_PROVIDER_ADMISSION_LISTEN_ADDR: "0.0.0.0:8300"
      QDL_PROVIDER_ADMISSION_SECRET: ${QDL_STABLE_INTERNAL_INGEST_SECRET:?set QDL_STABLE_INTERNAL_INGEST_SECRET}
      QDL_PROVIDER_ADMISSION_REDIS_URL: redis://stable_redis:6379/0
      QDL_PROVIDER_ADMISSION_REDIS_PREFIX: ${QDL_C36_ADMISSION_REDIS_PREFIX:?set QDL_C36_ADMISSION_REDIS_PREFIX}
      QDL_PROVIDER_ADMISSION_POLICY_PATH: /opt/qdl/config/v2/provider-admission-policy-v1.json
      QDL_PROVIDER_ADMISSION_POLICY_SHA256: ${QDL_C36_ADMISSION_POLICY_SHA256:?set QDL_C36_ADMISSION_POLICY_SHA256}

  query_v2_1:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/query/client-ca-bundle.crt
      QDL_STABLE_REFERENCE_DATA_ENABLED: "true"
      QDL_STABLE_PROVIDER_ADMISSION_URL: http://rust_core:8300

  query_v2_2:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/query/client-ca-bundle.crt
      QDL_STABLE_REFERENCE_DATA_ENABLED: "true"
      QDL_STABLE_PROVIDER_ADMISSION_URL: http://rust_core:8300

  stream_v2_active:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/stream/client-ca-bundle.crt

  stream_v2_passive:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/stream/client-ca-bundle.crt
