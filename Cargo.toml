[workspace]
members = ["rust/qdl-contracts", "rust/qdl-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
futures-util = "=0.3.31"
hex = "=0.4.3"
prost = "0.13.5"
qdl-contracts = { path = "rust/qdl-contracts" }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-webpki-roots"] }
zeroize = "=1.8.1"
