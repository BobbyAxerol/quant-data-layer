[workspace]
members = ["rust/qdl-contracts", "rust/qdl-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
prost = "0.13.5"
qdl-contracts = { path = "rust/qdl-contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.10.9"
