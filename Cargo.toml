[workspace]
members = [
    "rust/qdl-contracts",
    "rust/qdl-core",
    "rust/qdl-kafka",
    "rust/qdl-provider-envelope",
    "rust/qdl-realtime-core",
    "rust/qdl-venue-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
futures-util = "=0.3.31"
hex = "=0.4.3"
indexmap = "=2.7.1"
jobserver = "=0.1.32"
prost = "0.13.5"
proc-macro-crate = "=3.3.0"
ring = "=0.17.14"
qdl-contracts = { path = "rust/qdl-contracts", version = "=0.1.0" }
qdl-core = { path = "rust/qdl-core", version = "=0.1.0" }
rdkafka = { version = "=0.39.0", features = ["cmake-build", "ssl", "zstd"] }
redis = { version = "=0.25.4", default-features = false, features = ["script"] }
# Keep the asynchronous REST edge compatible with the workspace MSRV (Rust
# 1.82).  Newer reqwest 0.12 resolution can pull optional HTTP/3 crates that
# now require edition 2024 even when this client does not enable HTTP/3.
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-webpki-roots"] }
zeroize = "=1.8.1"
