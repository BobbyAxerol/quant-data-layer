[workspace]
members = ["rust/qdl-contracts", "rust/qdl-core", "rust/qdl-kafka"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
futures-util = "=0.3.31"
hex = "=0.4.3"
indexmap = "=2.7.1"
jobserver = "=0.1.32"
prost = "0.13.5"
proc-macro-crate = "=3.3.0"
qdl-contracts = { path = "rust/qdl-contracts" }
qdl-core = { path = "rust/qdl-core" }
rdkafka = { version = "=0.39.0", features = ["cmake-build", "ssl", "zstd"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-webpki-roots"] }
zeroize = "=1.8.1"
