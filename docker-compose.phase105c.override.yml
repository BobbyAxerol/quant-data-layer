services:
  rust_core:
    mem_limit: ${QDL_PHASE105C_RUST_CORE_MEMORY_LIMIT:?set to 512m}

  query_v2_1:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/query/client-ca-bundle.crt

  query_v2_2:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/query/client-ca-bundle.crt

  stream_v2_active:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/stream/client-ca-bundle.crt

  stream_v2_passive:
    environment:
      QDL_STABLE_TLS_CLIENT_CA_FILE: /stable-certs/stream/client-ca-bundle.crt
