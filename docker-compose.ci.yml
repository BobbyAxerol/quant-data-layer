# CI must not depend on or mutate host-wide production networks.
services:
  redis_marketdata:
    container_name: !reset null

  data_layer:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []

  alpha_service:
    container_name: !reset null
    volumes: !reset []

  test_runner:
    container_name: !reset null
    # Evidence remains outside serving images. Contract tests receive only the
    # frozen fixture directory and never a writable application-source mount.
    volumes: !override
      - ./upgrade/evidence:/app/upgrade/evidence:ro

  data_source_checker:
    container_name: !reset null
    volumes: !reset []

networks:
  bobby_network:
    external: false
  executor_network:
    external: false
