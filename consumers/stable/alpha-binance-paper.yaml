apiVersion: qdl/v2
kind: DataRequirement
metadata:
  id: alpha.binance.paper.stable
  owner: alpha-platform
  subject: spiffe://qdl/paper/alpha-binance-stable
  environment: paper
  revision: 2
spec:
  sdk_major: 2
  rollback_contract: V1
  execution_dependency: FORBIDDEN
  permissions:
  - instruments:read
  - snapshot:read
  - history:read
  - status:read
  - quality:read
  - stream:read
  purposes:
  - INTERNAL_ALPHA
  quotas:
    requests_per_minute: 180
    max_batch_items: 50
    max_warmup_rows: 2000
    max_streams: 20
    max_buffer_events: 2000
  requirements:
  - instrument_uid: a953e16e-7138-5562-b5e8-c337a44d0b65
    feed: BAR
    consumer_grade: ALPHA
    source_policy_id: crypto_primary_v2
    warmup_limit: 500
    max_freshness_ms: 180000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
    recovery: SNAPSHOT_AND_REPLAY
    bar_revision_policy: EMIT_REVISIONS
    interval: 1m
  - instrument_uid: a953e16e-7138-5562-b5e8-c337a44d0b65
    feed: TRADE
    consumer_grade: ALPHA
    source_policy_id: crypto_primary_v2
    warmup_limit: 0
    max_freshness_ms: 15000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
    recovery: SNAPSHOT_AND_REPLAY
    bar_revision_policy: LATEST
  - instrument_uid: ee93fabf-68df-5b50-8924-51bf25a5a757
    feed: BAR
    consumer_grade: ALPHA
    source_policy_id: crypto_primary_v2
    warmup_limit: 500
    max_freshness_ms: 180000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
    recovery: SNAPSHOT_AND_REPLAY
    bar_revision_policy: EMIT_REVISIONS
    interval: 1m
  - instrument_uid: ee93fabf-68df-5b50-8924-51bf25a5a757
    feed: TRADE
    consumer_grade: ALPHA
    source_policy_id: crypto_primary_v2
    warmup_limit: 0
    max_freshness_ms: 15000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
