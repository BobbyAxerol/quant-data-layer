[project]
name = "data-layer"
version = "0.1.0"
description = "Centralized data layer for Binance crypto and VN stock market data"
authors = [
    {name = "Bobby", email = "bobbyax.work@example.com"}
]
readme = "README.md"
requires-python = "^3.10"

dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "hiredis (>=2.3.0,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "pyarrow (>=17.0.0,<19.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "websocket-client (>=1.8.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "vnstock (>=3.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "orjson (>=3.10.0,<4.0.0)",
    "protobuf (>=6.31.1,<7.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
