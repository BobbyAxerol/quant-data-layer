[project]
name = "data-layer"
version = "2.0.0"
description = "Centralized data layer for Binance crypto and VN stock market data"
authors = [
    {name = "BobbyAxerol", email = "vugioan11022002@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"

dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "hiredis (>=2.3.0,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "websocket-client (>=1.8.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "vnstock (>=3.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "orjson (>=3.10.0,<4.0.0)",
    "msgpack (>=1.1.0,<2.0.0)",
    "protobuf (>=6.31.1,<7.0.0)",
    "grpcio (>=1.70.0,<2.0.0)",
    "confluent-kafka (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "idna (>=3.15,<4.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "soupsieve (>=2.8.4,<3.0.0)",
    "starlette (>=1.3.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
