syntax = "proto3";

package qdl.common.v1;

// DecimalValue is the only canonical representation for price, quantity and
// rates. source_text preserves the venue spelling for audit and replay.
message DecimalValue {
  oneof coefficient {
    sint64 mantissa = 1;
    string mantissa_text = 3;
  }
  sint32 scale = 2;
  string source_text = 4;
}

// QuantityUnit makes native quantity semantics explicit across spot,
// derivatives and equity markets. Asset symbols and contract multipliers are
// resolved from the versioned Instrument referenced by instrument_uid.
enum QuantityUnit {
  QUANTITY_UNIT_UNSPECIFIED = 0;
  QUANTITY_UNIT_BASE_ASSET = 1;
  QUANTITY_UNIT_QUOTE_ASSET = 2;
  QUANTITY_UNIT_CONTRACT = 3;
  QUANTITY_UNIT_SHARE = 4;
}

enum SourceRole {
  SOURCE_ROLE_UNSPECIFIED = 0;
  SOURCE_ROLE_PRIMARY = 1;
  SOURCE_ROLE_SECONDARY = 2;
  SOURCE_ROLE_REFERENCE = 3;
  SOURCE_ROLE_BACKFILL = 4;
}

enum SourceAuthority {
  SOURCE_AUTHORITY_UNSPECIFIED = 0;
  SOURCE_AUTHORITY_DISABLED = 1;
  SOURCE_AUTHORITY_SHADOW = 2;
  SOURCE_AUTHORITY_PRIMARY = 3;
}

enum QualityFlag {
  QUALITY_FLAG_UNSPECIFIED = 0;
  QUALITY_FLAG_SOURCE_TIME_MISSING = 1;
  QUALITY_FLAG_SEQUENCE_MISSING = 2;
  QUALITY_FLAG_SEQUENCE_GAP_BEFORE = 3;
  QUALITY_FLAG_DUPLICATE = 4;
  QUALITY_FLAG_OUT_OF_ORDER = 5;
  QUALITY_FLAG_LATE = 6;
  QUALITY_FLAG_STALE = 7;
  QUALITY_FLAG_PARSER_PARTIAL = 8;
  QUALITY_FLAG_FIELD_MISSING = 9;
  QUALITY_FLAG_PRECISION_ADJUSTED = 10;
  QUALITY_FLAG_SOURCE_FALLBACK = 11;
  QUALITY_FLAG_SOURCE_REFERENCE_ONLY = 12;
  QUALITY_FLAG_BACKFILLED = 13;
  QUALITY_FLAG_REVISED = 14;
  QUALITY_FLAG_CHECKSUM_FAILED = 15;
  QUALITY_FLAG_RESYNC_REQUIRED = 16;
  QUALITY_FLAG_CLOCK_SKEW_SUSPECTED = 17;
}

enum FeedLifecycleState {
  FEED_LIFECYCLE_STATE_UNSPECIFIED = 0;
  FEED_LIFECYCLE_STATE_DISABLED = 1;
  FEED_LIFECYCLE_STATE_STARTING = 2;
  FEED_LIFECYCLE_STATE_CONNECTING = 3;
  FEED_LIFECYCLE_STATE_SUBSCRIBING = 4;
  FEED_LIFECYCLE_STATE_SYNCING = 5;
  FEED_LIFECYCLE_STATE_LIVE = 6;
  FEED_LIFECYCLE_STATE_DEGRADED = 7;
  FEED_LIFECYCLE_STATE_GAPPED = 8;
  FEED_LIFECYCLE_STATE_RESYNCING = 9;
  FEED_LIFECYCLE_STATE_STALE = 10;
  FEED_LIFECYCLE_STATE_OFFLINE = 11;
  FEED_LIFECYCLE_STATE_HALTED = 12;
  FEED_LIFECYCLE_STATE_MARKET_CLOSED = 13;
}

enum AggressorSide {
  AGGRESSOR_SIDE_UNSPECIFIED = 0;
  AGGRESSOR_SIDE_BUY = 1;
  AGGRESSOR_SIDE_SELL = 2;
}

enum BookSide {
  BOOK_SIDE_UNSPECIFIED = 0;
  BOOK_SIDE_BID = 1;
  BOOK_SIDE_ASK = 2;
}

enum BarOrigin {
  BAR_ORIGIN_UNSPECIFIED = 0;
  BAR_ORIGIN_VENUE_NATIVE = 1;
  BAR_ORIGIN_AGGREGATED = 2;
  BAR_ORIGIN_BACKFILLED = 3;
  BAR_ORIGIN_RECONCILED = 4;
}
