syntax = "proto3";

package qdl.marketdata.v2;

import "qdl/common/v1/common.proto";
import "qdl/quality/v1/quality.proto";

enum TradeIdentityKind {
  TRADE_IDENTITY_KIND_UNSPECIFIED = 0;
  TRADE_IDENTITY_KIND_NATIVE = 1;
  TRADE_IDENTITY_KIND_DERIVED_RAW_CAPTURE = 2;
}

enum BarLifecycle {
  BAR_LIFECYCLE_UNSPECIFIED = 0;
  BAR_LIFECYCLE_IN_PROGRESS = 1;
  BAR_LIFECYCLE_FINAL = 2;
  BAR_LIFECYCLE_REVISED = 3;
  BAR_LIFECYCLE_CANCELLED = 4;
}

// The population behind a long/short ratio is material: global accounts, top
// accounts and top positions are different provider products and must never be
// collapsed into one unnamed ratio.
enum LongShortRatioPopulation {
  LONG_SHORT_RATIO_POPULATION_UNSPECIFIED = 0;
  LONG_SHORT_RATIO_POPULATION_GLOBAL_ACCOUNT = 1;
  LONG_SHORT_RATIO_POPULATION_TOP_ACCOUNT = 2;
  LONG_SHORT_RATIO_POPULATION_TOP_POSITION = 3;
}

// A provider-native basis and a QDL-derived basis have different authority and
// provenance rules. Consumers can only compare them after inspecting this kind.
enum BasisKind {
  BASIS_KIND_UNSPECIFIED = 0;
  BASIS_KIND_PROVIDER_NATIVE = 1;
  BASIS_KIND_DERIVED = 2;
}

enum MetricUnit {
  METRIC_UNIT_UNSPECIFIED = 0;
  METRIC_UNIT_RATIO = 1;
  METRIC_UNIT_PRICE = 2;
  METRIC_UNIT_BASE_ASSET = 3;
  METRIC_UNIT_QUOTE_ASSET = 4;
  METRIC_UNIT_CONTRACT = 5;
  METRIC_UNIT_NOTIONAL = 6;
  METRIC_UNIT_PERCENT = 7;
  METRIC_UNIT_BASIS_POINTS = 8;
}

message Trade {
  string native_trade_id = 1;
  qdl.common.v1.DecimalValue price = 2;
  qdl.common.v1.DecimalValue quantity = 3;
  qdl.common.v1.AggressorSide aggressor_side = 4;
  bool is_block_trade = 5;
  bool is_buyer_maker = 6;
  qdl.common.v1.QuantityUnit quantity_unit = 7;
  TradeIdentityKind identity_kind = 8;
}

message Quote {
  qdl.common.v1.DecimalValue bid_price = 1;
  qdl.common.v1.DecimalValue bid_quantity = 2;
  qdl.common.v1.DecimalValue ask_price = 3;
  qdl.common.v1.DecimalValue ask_quantity = 4;
  uint32 level = 5;
  qdl.common.v1.QuantityUnit quantity_unit = 6;
}

message Bar {
  string interval = 1;
  int64 open_time_ns = 2;
  int64 close_time_ns = 3;
  qdl.common.v1.DecimalValue open = 4;
  qdl.common.v1.DecimalValue high = 5;
  qdl.common.v1.DecimalValue low = 6;
  qdl.common.v1.DecimalValue close = 7;
  qdl.common.v1.DecimalValue volume = 8;
  uint64 trade_count = 9;
  bool is_final = 10;
  uint32 revision = 11;
  qdl.common.v1.BarOrigin origin = 12;
  BarLifecycle lifecycle = 13;
  optional bytes supersedes_event_id = 14;
  qdl.common.v1.QuantityUnit volume_unit = 15;
  optional qdl.common.v1.DecimalValue base_volume = 16;
  optional qdl.common.v1.DecimalValue quote_volume = 17;
  optional qdl.common.v1.DecimalValue contract_volume = 18;
}

message BookLevel {
  qdl.common.v1.BookSide side = 1;
  qdl.common.v1.DecimalValue price = 2;
  qdl.common.v1.DecimalValue quantity = 3;
  uint32 order_count = 4;
  qdl.common.v1.QuantityUnit quantity_unit = 5;
}

message OrderBookSnapshot {
  string native_sequence = 1;
  string checksum = 2;
  repeated BookLevel levels = 3;
  uint32 depth = 4;
}

message OrderBookDelta {
  string native_sequence_start = 1;
  string native_sequence_end = 2;
  string snapshot_sequence = 3;
  string checksum = 4;
  repeated BookLevel updates = 5;
  bool reset = 6;
}

message FundingRate {
  qdl.common.v1.DecimalValue rate = 1;
  int64 funding_time_ns = 2;
  optional int64 next_funding_time_ns = 3;
}

message OpenInterest {
  qdl.common.v1.DecimalValue quantity = 1;
  optional qdl.common.v1.DecimalValue notional = 2;
  qdl.common.v1.QuantityUnit quantity_unit = 3;
  string sampling_interval = 4;
}

message MarkIndexPrice {
  qdl.common.v1.DecimalValue mark_price = 1;
  qdl.common.v1.DecimalValue index_price = 2;
}

message LongShortRatio {
  LongShortRatioPopulation population = 1;
  string sampling_interval = 2;
  qdl.common.v1.DecimalValue long_value = 3;
  qdl.common.v1.DecimalValue short_value = 4;
  qdl.common.v1.DecimalValue long_short_ratio = 5;
  MetricUnit value_unit = 6;
}

message TakerFlow {
  string sampling_interval = 1;
  qdl.common.v1.DecimalValue buy_volume = 2;
  qdl.common.v1.DecimalValue sell_volume = 3;
  qdl.common.v1.DecimalValue buy_sell_ratio = 4;
  qdl.common.v1.QuantityUnit quantity_unit = 5;
}

message Basis {
  BasisKind kind = 1;
  string sampling_interval = 2;
  qdl.common.v1.DecimalValue basis = 3;
  MetricUnit basis_unit = 4;
  optional qdl.common.v1.DecimalValue annualized_basis = 5;
  string reference_instrument_uid = 6;
  string formula_id = 7;
  repeated string input_instrument_uids = 8;
}

// Versioned instrument metadata as an event. The envelope still identifies the
// instrument revision; this payload gives consumers the exact tradable rules
// observed at that revision without copying provider-specific JSON.
message ContractMetadata {
  string contract_kind = 1;
  string settlement_asset = 2;
  qdl.common.v1.DecimalValue contract_multiplier = 3;
  qdl.common.v1.DecimalValue price_tick = 4;
  qdl.common.v1.DecimalValue quantity_step = 5;
  optional int64 expiry_time_ns = 6;
  optional int64 funding_interval_ns = 7;
  bool continuous = 8;
  string underlying_instrument_uid = 9;
}

message Ticker {
  qdl.common.v1.DecimalValue last_price = 1;
  optional qdl.common.v1.DecimalValue last_quantity = 2;
  optional qdl.common.v1.DecimalValue open_24h = 3;
  optional qdl.common.v1.DecimalValue high_24h = 4;
  optional qdl.common.v1.DecimalValue low_24h = 5;
  optional qdl.common.v1.DecimalValue volume_24h = 6;
  qdl.common.v1.QuantityUnit last_quantity_unit = 7;
  qdl.common.v1.QuantityUnit volume_24h_unit = 8;
}

message EventEnvelope {
  string schema_name = 1;
  uint32 schema_major = 2;
  uint32 schema_minor = 3;
  bytes event_id = 4;
  string instrument_uid = 5;
  string instrument_id = 6;
  uint64 instrument_revision = 7;
  string venue = 8;
  string market = 9;
  string product_type = 10;
  string native_symbol = 11;
  string provider = 12;
  string source_id = 13;
  qdl.common.v1.SourceRole source_role = 14;
  uint64 lease_epoch = 15;
  int64 source_event_time_ns = 16;
  int64 received_at_ns = 17;
  int64 normalized_at_ns = 18;
  int64 published_at_ns = 19;
  string source_sequence = 20;
  uint64 partition_sequence = 21;
  string normalizer_version = 22;
  string adapter_version = 23;
  repeated qdl.common.v1.QualityFlag quality_flags = 24;
  bytes raw_payload_hash = 25;
  string correlation_id = 26;
  uint64 config_revision = 27;
  string source_session_id = 28;
  uint64 connection_generation = 29;
  uint64 authority_revision = 30;
  uint64 partition_plan_epoch = 31;
  bytes canonical_payload_hash = 32;
  bytes raw_capture_id = 33;

  oneof payload {
    Trade trade = 40;
    Quote quote = 41;
    Bar bar = 42;
    OrderBookSnapshot book_snapshot = 43;
    OrderBookDelta book_delta = 44;
    FundingRate funding_rate = 45;
    OpenInterest open_interest = 46;
    MarkIndexPrice mark_index_price = 47;
    Ticker ticker = 48;
    qdl.quality.v1.FeedStateEvent feed_state = 49;
    qdl.quality.v1.DataQualityEvent quality_event = 50;
    LongShortRatio long_short_ratio = 51;
    TakerFlow taker_flow = 52;
    Basis basis = 53;
    ContractMetadata contract_metadata = 54;
  }
}
