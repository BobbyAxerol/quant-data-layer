syntax = "proto3";

package qdl.instrument.v1;

import "qdl/common/v1/common.proto";

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_CRYPTO = 1;
  ASSET_CLASS_EQUITY = 2;
  ASSET_CLASS_DERIVATIVE = 3;
  ASSET_CLASS_OPTION = 4;
  ASSET_CLASS_INDEX = 5;
}

enum ProductType {
  PRODUCT_TYPE_UNSPECIFIED = 0;
  PRODUCT_TYPE_SPOT = 1;
  PRODUCT_TYPE_PERPETUAL = 2;
  PRODUCT_TYPE_FUTURE = 3;
  PRODUCT_TYPE_OPTION = 4;
  PRODUCT_TYPE_COMMON_STOCK = 5;
  PRODUCT_TYPE_INDEX = 6;
  PRODUCT_TYPE_EVENT_CONTRACT = 7;
}

enum OptionType {
  OPTION_TYPE_UNSPECIFIED = 0;
  OPTION_TYPE_CALL = 1;
  OPTION_TYPE_PUT = 2;
}

enum InstrumentStatus {
  INSTRUMENT_STATUS_UNSPECIFIED = 0;
  INSTRUMENT_STATUS_PRELISTED = 1;
  INSTRUMENT_STATUS_ACTIVE = 2;
  INSTRUMENT_STATUS_HALTED = 3;
  INSTRUMENT_STATUS_EXPIRED = 4;
  INSTRUMENT_STATUS_DELISTED = 5;
}

message Instrument {
  string instrument_uid = 1;
  string instrument_id = 2;
  uint64 metadata_revision = 3;
  string venue = 4;
  string market = 5;
  AssetClass asset_class = 6;
  ProductType product_type = 7;
  string native_symbol = 8;
  string base_asset = 9;
  string quote_asset = 10;
  string settlement_asset = 11;
  qdl.common.v1.DecimalValue price_tick = 12;
  qdl.common.v1.DecimalValue quantity_step = 13;
  qdl.common.v1.DecimalValue contract_multiplier = 14;
  optional int64 expiry_time_ns = 15;
  optional qdl.common.v1.DecimalValue strike_price = 16;
  OptionType option_type = 17;
  string underlying_instrument_uid = 18;
  string session_calendar_id = 19;
  InstrumentStatus status = 20;
  int64 valid_from_ns = 21;
  optional int64 valid_to_ns = 22;
  map<string, string> attributes = 23;
}

message InstrumentAlias {
  string provider = 1;
  string market = 2;
  string native_symbol = 3;
  string instrument_uid = 4;
  uint64 instrument_revision = 5;
  int64 valid_from_ns = 6;
  optional int64 valid_to_ns = 7;
}

message TradingSession {
  string name = 1;
  string local_start = 2;
  string local_end = 3;
  string session_type = 4;
}

message SessionCalendar {
  string calendar_id = 1;
  uint64 revision = 2;
  string timezone_iana = 3;
  bool continuous = 4;
  repeated TradingSession sessions = 5;
  repeated string holidays = 6;
  map<string, string> special_sessions = 7;
}

message VenueCapabilities {
  string provider = 1;
  string venue = 2;
  string market = 3;
  string region_profile = 4;
  string legal_entity = 5;
  string account_tier = 6;
  bool supports_rest_history = 7;
  bool supports_trades = 8;
  bool supports_bbo = 9;
  bool supports_native_bars = 10;
  bool supports_l2_snapshot = 11;
  bool supports_l2_delta = 12;
  bool has_trade_id = 13;
  bool has_sequence = 14;
  bool has_checksum = 15;
  bool requires_resnapshot_on_gap = 16;
  bool supports_resubscribe = 17;
  repeated string native_bar_intervals = 18;
  string timestamp_precision = 19;
  string rate_limit_model = 20;
  qdl.common.v1.SourceAuthority source_authority = 21;
  map<string, string> feed_constraints = 22;
}
