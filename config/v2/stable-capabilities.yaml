capability_gates:
  VN_TRADE:
    stable: false
    reason: >-
      the vn_edge_v2 role sits behind the stable-vn Compose profile, has never
      been created, and no VN partition has ever appeared in the canonical
      spool; the capability was advertised as PROVIDER_DERIVED_DURABLE_REPLAY
      while nothing had produced a single event
  VN_BAR:
    stable: false
    reason: >-
      same as VN_TRADE; certification requires the role running inside VN
      session hours against the real DNSE provider with recorded evidence
  CRYPTO_L2:
    stable: false
    reason: requires equal Binance/OKX snapshot-delta resync certification
  VN_QUOTE:
    stable: false
    reason: requires a real DNSE/vnstock bid-ask subscription and source-switch certification
  OKX_SBE:
    stable: false
    reason: entitlement and JSON parity required
  OKX_TRADES_ALL:
    stable: false
    reason: atomic trade-count capability must be activated explicitly
