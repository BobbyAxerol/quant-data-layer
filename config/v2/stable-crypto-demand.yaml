# Declared crypto demand for the stable V2 catalog.
#
# The catalog is a generated artifact. Committing the demand that produced it
# makes the generation reproducible and reviewable: adding a symbol or an
# interval becomes an edit here plus a regeneration, not a hand edit of the
# generated YAML, which is how the six ETH bindings were added and is the
# defect recorded in plan section C.16.
#
# VN instruments are not expressible here. They come from a vendor SDK with no
# exchangeInfo-style capture, so they are generated by a separate path and are
# deliberately absent rather than silently omitted.
