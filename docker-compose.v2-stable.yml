      stable_state_init: {condition: service_completed_successfully}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import json,time; p=json.load(open('/var/lib/qdl-stable/runtime/authority-dispatcher-health.json')); assert p['status']=='READY' and time.time_ns()-int(p['heartbeat_ns'])<5000000000"]
      interval: 3s
      timeout: 2s
      retries: 20

  rust_core:
    <<: *rust
    entrypoint: [/usr/local/bin/qdl-realtime-core]
    command: [/runtime/core.json]
    environment:
      <<: *rust-env
      QDL_KAFKA_CERT_ROOT: /stable-certs/core
      QDL_KAFKA_CLIENT_ID: qdl-v2-realtime-core-001
      QDL_KAFKA_GROUP_ID: qdl-v2-realtime-core-v2
      # The private admission relay is inert unless the bounded Reference/L2
      # override enables it. Rust owns every admission transition; Python only
      # signs requests before calling this internal endpoint.
      QDL_PROVIDER_ADMISSION_ENABLED: ${QDL_STABLE_PROVIDER_ADMISSION_ENABLED:-false}
      QDL_PROVIDER_ADMISSION_LISTEN_ADDR: 0.0.0.0:8300
      QDL_PROVIDER_ADMISSION_SECRET: ${QDL_STABLE_INTERNAL_INGEST_SECRET:?set QDL_STABLE_INTERNAL_INGEST_SECRET}
      QDL_PROVIDER_ADMISSION_POLICY_PATH: /opt/qdl/config/v2/provider-admission-policy-v1.json
      QDL_PROVIDER_ADMISSION_POLICY_SHA256: e4a4330d503e3dd163b6ff7391f5e034a80555a23679ba30bb23ea78ca8053ad
      QDL_PROVIDER_ADMISSION_REDIS_PREFIX: qdl:stable:v2:provider-admission:v1
      QDL_PROVIDER_ADMISSION_REDIS_URL: redis://stable_redis:6379/0
    volumes: [stable_tls:/stable-certs:ro, "${QDL_STABLE_RUNTIME_DIR:?set QDL_STABLE_RUNTIME_DIR}/core.json:/runtime/core.json:ro"]
    depends_on:
      stable_tls_init: {condition: service_completed_successfully}
