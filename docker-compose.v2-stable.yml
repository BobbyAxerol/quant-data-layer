name: qdl_v2_stable_candidate

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: SSL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,SSL:SSL
  KAFKA_LISTENERS: CONTROLLER://:9093,SSL://:9092
  KAFKA_SSL_CLIENT_AUTH: required
  KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.jks
  KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password
  KAFKA_SSL_KEY_CREDENTIALS: key.password
  KAFKA_SSL_KEYSTORE_CREDENTIALS: store.password
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SSL_TRUSTSTORE_TYPE: JKS
  KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.3,TLSv1.2
  KAFKA_SSL_PROTOCOL: TLSv1.3
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
  KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=([^,]+).*$$/$$1/,DEFAULT
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_SUPER_USERS: User:phase8-admin;User:kafka1;User:kafka2;User:kafka3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_LOG_RETENTION_MS: 86400000
  KAFKA_LOG_SEGMENT_BYTES: 16777216
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

x-kafka: &kafka
  image: apache/kafka@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
  restart: "no"
  security_opt: [no-new-privileges:true]
  networks: [stable_internal]
  # Kafka Zstd JNI loads a native library from java.io.tmpdir.
  # Keep this broker tmpfs bounded and non-suid/non-device, but executable.
  tmpfs: ["/tmp:rw,nosuid,nodev,exec,size=32m"]
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9092'"]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 20s
  # Coordinator recovery exceeded 512 MiB despite a 256 MiB JVM heap. Keep
  # native/direct-buffer headroom bounded without enlarging the Java heap.
  mem_limit: 768m
  cpus: 0.75

x-stable-env: &stable-env
  QDL_ENVIRONMENT: paper
  QDL_CONFIG_REVISION: ${QDL_CONFIG_REVISION:-phase-b-stable-1}
  QDL_STABLE_AUTHORITY_MODE: ${QDL_STABLE_AUTHORITY_MODE:?set QDL_STABLE_AUTHORITY_MODE}
  QDL_STABLE_AUTHORITY_REVISION: ${QDL_STABLE_AUTHORITY_REVISION:?set QDL_STABLE_AUTHORITY_REVISION}
  QDL_STABLE_SCHEMA_DIGEST: ${QDL_STABLE_SCHEMA_DIGEST:?set QDL_STABLE_SCHEMA_DIGEST}
  # Authority comes from the generated read-only record. These two values are
  # only startup cross-checks and must match authority.json exactly.
  QDL_STABLE_RUNTIME_DIR: /runtime
  QDL_STABLE_STATE_DIR: /var/lib/qdl-stable/runtime
  QDL_STABLE_DURABLE_STATE_DIR: /var/lib/qdl-stable/shared
  QDL_STABLE_SOURCE_BINDINGS: /app/config/v2/stable-source-bindings.yaml
  QDL_STABLE_CONSUMER_MANIFESTS: /app/consumers/stable/monitoring-multivenue.yaml:/app/consumers/stable/alpha-binance-paper.yaml:/app/consumers/stable/alpha-okx-paper.yaml:/app/consumers/stable/alpha-vn-paper.yaml:/app/consumers/stable/trading-system-paper.yaml:/app/consumers/stable/reference-l2-stable.yaml
  QDL_STABLE_INTERNAL_INGEST_SECRET: ${QDL_STABLE_INTERNAL_INGEST_SECRET:?set QDL_STABLE_INTERNAL_INGEST_SECRET}
  QDL_STABLE_REDIS_URL: redis://stable_redis:6379/0
  QDL_STABLE_REDIS_PREFIX: qdl:stable:v2:paper:candidate
  QDL_STABLE_CURSOR_KEYS_JSON: ${QDL_STABLE_CURSOR_KEYS_JSON:?set QDL_STABLE_CURSOR_KEYS_JSON}
  QDL_STABLE_CURSOR_ACTIVE_KEY_ID: stable-k1
  QDL_STABLE_CURSOR_TTL_SECONDS: "3600"
  QDL_STABLE_MAX_REQUEST_BYTES: "1048576"
  # Reference batches may use a bounded provider deadline up to 60 seconds.
  # Keep the stable query boundary above that while retaining concurrency caps.
  QDL_STABLE_REQUEST_DEADLINE_SECONDS: "90"
  QDL_STABLE_MAX_CONCURRENT_REQUESTS: "200"
  QDL_STABLE_MAX_CONCURRENT_RPCS: "200"
  QDL_STABLE_MAX_STREAMS: "1000"
  QDL_STABLE_MAX_BUFFER_EVENTS: "2000"
  QDL_STABLE_MAX_REPLAY_EVENTS: "5000"
  # Reference data is an on-demand query capability. Enabling it constructs
  # bounded adapters only; it creates no subscription, poller or execution
  # authority until a declared alpha/research request arrives.
  QDL_STABLE_REFERENCE_DATA_ENABLED: "${QDL_STABLE_REFERENCE_DATA_ENABLED:-true}"
  QDL_STABLE_LEASE_SHARD_ID: stable-stream-v2
  QDL_STABLE_LEASE_TTL_SECONDS: "15"
  QDL_STABLE_LEASE_RENEW_SECONDS: "5"
  QDL_DATA_JWT_KEYS_JSON: ${QDL_STABLE_JWT_KEYS_JSON:?set QDL_STABLE_JWT_KEYS_JSON}
  QDL_DATA_JWT_KEY_SUBJECTS_JSON: ${QDL_STABLE_JWT_KEY_SUBJECTS_JSON:?set QDL_STABLE_JWT_KEY_SUBJECTS_JSON}
  QDL_DATA_JWT_ISSUER: https://identity.qdl.stable.internal
  QDL_DATA_JWT_AUDIENCE: qdl-v2-stable
  QDL_DATA_JWT_ALGORITHMS: RS256
  QDL_DATA_JWT_MAX_LIFETIME_SECONDS: "900"

x-python: &python
  image: ${QDL_STABLE_PYTHON_IMAGE:?set immutable QDL_STABLE_PYTHON_IMAGE}
  user: "10001:10001"
  restart: "no"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [stable_internal]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  volumes:
    - stable_state:/var/lib/qdl-stable
    - stable_tls:/stable-certs:ro
    - ${QDL_STABLE_RUNTIME_DIR:?set QDL_STABLE_RUNTIME_DIR}:/runtime:ro
  environment: {<<: *stable-env}
  mem_limit: 512m
  cpus: 0.75

x-rust: &rust
  image: ${QDL_STABLE_RUST_IMAGE:?set immutable QDL_STABLE_RUST_IMAGE}
  user: "10001:10001"
  restart: "no"
  stop_grace_period: 45s
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [stable_internal]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m"]
  mem_limit: 256m
  cpus: 0.75

x-rust-env: &rust-env
  QDL_KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
  QDL_KAFKA_CERT_ROOT: /stable-certs/producer
  QDL_KAFKA_REQUEST_TIMEOUT_SECONDS: "30"

services:
  kafka1:
    <<: *kafka
    hostname: kafka1
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: "SSL://kafka1:9092", KAFKA_SSL_KEYSTORE_FILENAME: kafka1.keystore.p12}
    volumes: ["${QDL_STABLE_CERT_DIR:?set QDL_STABLE_CERT_DIR}:/etc/kafka/secrets:ro", kafka1_data:/var/lib/kafka/data]
  kafka2:
    <<: *kafka
    hostname: kafka2
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: "SSL://kafka2:9092", KAFKA_SSL_KEYSTORE_FILENAME: kafka2.keystore.p12}
    volumes: ["${QDL_STABLE_CERT_DIR:?set QDL_STABLE_CERT_DIR}:/etc/kafka/secrets:ro", kafka2_data:/var/lib/kafka/data]
  kafka3:
    <<: *kafka
    hostname: kafka3
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: "SSL://kafka3:9092", KAFKA_SSL_KEYSTORE_FILENAME: kafka3.keystore.p12}
    volumes: ["${QDL_STABLE_CERT_DIR:?set QDL_STABLE_CERT_DIR}:/etc/kafka/secrets:ro", kafka3_data:/var/lib/kafka/data]

  stable_authority_db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    profiles: [stable-authority]
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [stable_internal]
    environment:
      POSTGRES_DB: qdl_authority
      POSTGRES_USER: qdl_authority
      POSTGRES_PASSWORD: ${QDL_STABLE_CONTROL_DB_PASSWORD:?set QDL_STABLE_CONTROL_DB_PASSWORD}
      QDL_STABLE_DISPATCHER_DB_PASSWORD: ${QDL_STABLE_DISPATCHER_DB_PASSWORD:?set QDL_STABLE_DISPATCHER_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - stable_authority_db:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,noexec,size=8m
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U qdl_authority -d qdl_authority"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50

  stable_redis:
    image: redis@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: "no"
    user: "999:1000"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [stable_internal]
    tmpfs: ["/data:rw,nosuid,nodev,noexec,uid=999,gid=1000,mode=0700,size=160m"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 2s, retries: 30}
    mem_limit: 160m
    cpus: 0.25

  stable_admin:
    image: apache/kafka@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    profiles: [stable-admin]
    entrypoint: [/bin/true]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [stable_internal]
    volumes: ["${QDL_STABLE_CERT_DIR:?set QDL_STABLE_CERT_DIR}:/etc/kafka/secrets:ro"]

  stable_state_init:
    image: ${QDL_STABLE_PYTHON_IMAGE:?set immutable QDL_STABLE_PYTHON_IMAGE}
    user: "0:0"
    command: [sh, -c, "install -d -o 10001 -g 10001 -m 0750 /var/lib/qdl-stable/runtime /var/lib/qdl-stable/shared"]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    networks: [stable_internal]
    volumes: [stable_state:/var/lib/qdl-stable]

  stable_tls_init:
    image: ${QDL_STABLE_PYTHON_IMAGE:?set immutable QDL_STABLE_PYTHON_IMAGE}
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        install -d -o 10001 -g 10001 -m 0750
        /stable-certs/producer /stable-certs/core /stable-certs/projector
        /stable-certs/query /stable-certs/stream /stable-certs/authority-dispatcher &&
        cp /source/producer/* /stable-certs/producer/ &&
        cp /source/core/* /stable-certs/core/ &&
        cp /source/projector/* /stable-certs/projector/ &&
        cp /source/query/* /stable-certs/query/ &&
        cp /source/stream/* /stable-certs/stream/ &&
        cp /source/authority-dispatcher/* /stable-certs/authority-dispatcher/ &&
        chown -R 10001:10001 /stable-certs &&
        find /stable-certs -type f -exec chmod 0440 {} +
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    networks: [stable_internal]
    volumes:
      - ${QDL_STABLE_PRODUCER_CERT_DIR:?set QDL_STABLE_PRODUCER_CERT_DIR}:/source/producer:ro
      - ${QDL_STABLE_CORE_CERT_DIR:?set QDL_STABLE_CORE_CERT_DIR}:/source/core:ro
      - ${QDL_STABLE_PROJECTOR_CERT_DIR:?set QDL_STABLE_PROJECTOR_CERT_DIR}:/source/projector:ro
      - ${QDL_STABLE_QUERY_CERT_DIR:?set QDL_STABLE_QUERY_CERT_DIR}:/source/query:ro
      - ${QDL_STABLE_STREAM_CERT_DIR:?set QDL_STABLE_STREAM_CERT_DIR}:/source/stream:ro
      - ${QDL_STABLE_AUTHORITY_CERT_DIR:?set QDL_STABLE_AUTHORITY_CERT_DIR}:/source/authority-dispatcher:ro
      - stable_tls:/stable-certs

  query_v2_1:
    <<: *python
    command: [python, -m, app.entrypoints.query_v2_stable]
    networks:
      stable_internal: {}
      stable_ingress: {}
      stable_consumer: {aliases: [qdl-v2-query]}
    ports: ["127.0.0.1:18201:8200"]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-query-1
      QDL_STABLE_CONSUMER_GROUP: stable-query-1
      QDL_STABLE_HTTP_PORT: "8200"
      QDL_STABLE_GRPC_PORT: "8210"
      # Phase 10.3 permits explicit alpha BAR fresh-snapshot warmups only.
      # It does not grant a replayable stream or execution authority.
      QDL_STABLE_PASS_THROUGH_ENABLED: "true"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-query-1-audit.jsonl
      QDL_STABLE_TLS_CA_FILE: /stable-certs/query/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/query/server.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/query/server.key
    depends_on: {stable_redis: {condition: service_healthy}, stable_state_init: {condition: service_completed_successfully}, stable_tls_init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, python, -c, "import ssl,urllib.request; c=ssl.create_default_context(cafile='/stable-certs/query/ca.crt'); c.load_cert_chain('/stable-certs/query/server.crt','/stable-certs/query/server.key'); urllib.request.urlopen('https://localhost:8200/health/ready',context=c,timeout=2)"], interval: 5s, timeout: 3s, retries: 20}

  query_v2_2:
    <<: *python
    command: [python, -m, app.entrypoints.query_v2_stable]
    networks:
      stable_internal: {}
      stable_ingress: {}
      stable_consumer: {aliases: [qdl-v2-query]}
    ports: ["127.0.0.1:18202:8200"]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-query-2
      QDL_STABLE_CONSUMER_GROUP: stable-query-2
      QDL_STABLE_HTTP_PORT: "8200"
      QDL_STABLE_GRPC_PORT: "8210"
      # Keep both query replicas on the same declared history capability.
      QDL_STABLE_PASS_THROUGH_ENABLED: "true"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-query-2-audit.jsonl
      QDL_STABLE_TLS_CA_FILE: /stable-certs/query/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/query/server.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/query/server.key
    depends_on: {stable_redis: {condition: service_healthy}, stable_state_init: {condition: service_completed_successfully}, stable_tls_init: {condition: service_completed_successfully}}

  stream_v2_active:
    <<: *python
    command: [python, -m, app.entrypoints.stream_v2_stable]
    networks:
      stable_internal: {}
      stable_ingress: {}
      stable_consumer: {aliases: [qdl-v2-stream-a]}
    ports: ["127.0.0.1:18210:8200", "127.0.0.1:18220:8210"]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-stream-active
      QDL_STABLE_CONSUMER_GROUP: stable-stream-active
      QDL_STABLE_HTTP_PORT: "8200"
      QDL_STABLE_GRPC_PORT: "8210"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-stream-active-audit.jsonl
      QDL_STABLE_TLS_CA_FILE: /stable-certs/stream/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/stream/server.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/stream/server.key
    depends_on: {stable_redis: {condition: service_healthy}, stable_state_init: {condition: service_completed_successfully}, stable_tls_init: {condition: service_completed_successfully}}

  stream_v2_passive:
    <<: *python
    command: [python, -m, app.entrypoints.stream_v2_stable]
    networks:
      stable_internal: {}
      stable_ingress: {}
      stable_consumer: {aliases: [qdl-v2-stream-b]}
    ports: ["127.0.0.1:18211:8200", "127.0.0.1:18221:8210"]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-stream-passive
      QDL_STABLE_CONSUMER_GROUP: stable-stream-passive
      QDL_STABLE_HTTP_PORT: "8200"
      QDL_STABLE_GRPC_PORT: "8210"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-stream-passive-audit.jsonl
      QDL_STABLE_TLS_CA_FILE: /stable-certs/stream/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/stream/server.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/stream/server.key
    depends_on: {stable_redis: {condition: service_healthy}, stable_state_init: {condition: service_completed_successfully}, stable_tls_init: {condition: service_completed_successfully}}

  projector_v2:
    <<: *python
    command: [python, -m, app.entrypoints.projector_v2_stable]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-projector-1
      QDL_STABLE_CONSUMER_GROUP: stable-projector-v1
      QDL_STABLE_HTTP_PORT: "8230"
      QDL_STABLE_GRPC_PORT: "8231"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-projector-1-audit.jsonl
      QDL_STABLE_KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      QDL_STABLE_KAFKA_CLIENT_ID: stable-projector-1
      QDL_STABLE_KAFKA_CANONICAL_TOPIC: md.canonical.v2
      QDL_STABLE_KAFKA_CERT_ROOT: /stable-certs/projector
      QDL_STABLE_TLS_CA_FILE: /stable-certs/projector/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/projector/client.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/projector/client.key
      QDL_STABLE_STREAM_INGEST_URLS_JSON: '["https://stream_v2_active:8200","https://stream_v2_passive:8200"]'
      # Bound r11 catch-up inside this role's existing 512 MiB cgroup. Kafka
      # retains pressure once the projector pauses canonical consumption.
      QDL_STABLE_MAX_PENDING_RECORDS: "2048"
      QDL_STABLE_MAX_PENDING_BYTES: "33554432"
    volumes:
      - stable_state:/var/lib/qdl-stable
      - stable_tls:/stable-certs:ro
      - ${QDL_STABLE_RUNTIME_DIR:?set QDL_STABLE_RUNTIME_DIR}:/runtime:ro
    depends_on:
      stable_tls_init: {condition: service_completed_successfully}
      stable_state_init: {condition: service_completed_successfully}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
      stable_redis: {condition: service_healthy}
      stream_v2_active: {condition: service_started}
      stream_v2_passive: {condition: service_started}

  projector_v2_2:
    <<: *python
    command: [python, -m, app.entrypoints.projector_v2_stable]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-projector-2
      QDL_STABLE_CONSUMER_GROUP: stable-projector-v1
      QDL_STABLE_HTTP_PORT: "8230"
      QDL_STABLE_GRPC_PORT: "8231"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-projector-2-audit.jsonl
      QDL_STABLE_KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      QDL_STABLE_KAFKA_CLIENT_ID: stable-projector-2
      QDL_STABLE_KAFKA_CANONICAL_TOPIC: md.canonical.v2
      QDL_STABLE_KAFKA_CERT_ROOT: /stable-certs/projector
      QDL_STABLE_TLS_CA_FILE: /stable-certs/projector/ca.crt
      QDL_STABLE_TLS_CERT_FILE: /stable-certs/projector/client.crt
      QDL_STABLE_TLS_KEY_FILE: /stable-certs/projector/client.key
      QDL_STABLE_STREAM_INGEST_URLS_JSON: '["https://stream_v2_active:8200","https://stream_v2_passive:8200"]'
      QDL_STABLE_MAX_PENDING_RECORDS: "2048"
      QDL_STABLE_MAX_PENDING_BYTES: "33554432"
    volumes:
      - stable_state:/var/lib/qdl-stable
      - stable_tls:/stable-certs:ro
      - ${QDL_STABLE_RUNTIME_DIR:?set QDL_STABLE_RUNTIME_DIR}:/runtime:ro
    depends_on:
      stable_tls_init: {condition: service_completed_successfully}
      stable_state_init: {condition: service_completed_successfully}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
      stable_redis: {condition: service_healthy}
      stream_v2_active: {condition: service_started}
      stream_v2_passive: {condition: service_started}

  projector_v2_3:
    <<: *python
    command: [python, -m, app.entrypoints.projector_v2_stable]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-projector-3
      QDL_STABLE_CONSUMER_GROUP: stable-projector-v1
      QDL_STABLE_HTTP_PORT: "8230"
      QDL_STABLE_GRPC_PORT: "8231"
      QDL_STABLE_AUDIT_PATH: /var/lib/qdl-stable/runtime/stable-projector-3-audit.jsonl
