  binance_bar_edge:
    <<: *python
    command: [python, -m, app.entrypoints.binance_bar_v2_stable]
    networks: [stable_internal, stable_egress]
    environment:
      <<: *stable-env
      QDL_STABLE_INSTANCE_ID: stable-binance-bar-edge
      QDL_STABLE_CONSUMER_GROUP: stable-binance-bar-edge
      QDL_STABLE_ACQUISITION_BINDINGS: /app/config/v2/stable-acquisition-bindings.yaml
      QDL_STABLE_RUNTIME_DIR: /runtime
      QDL_KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      QDL_KAFKA_CERT_ROOT: /stable-certs/producer
      QDL_KAFKA_CLIENT_ID: qdl-v2-stable-binance-bars
      # Must cover the greatest durable final-BAR warmup declared by the
      # governed Trading System/alpha manifests.
      QDL_STABLE_BAR_WARMUP_ROWS: "1000"
      # A final row is provider-confirmed, not timer-confirmed. Start the
      # first bounded read promptly after the close, then retry that exact
      # target until it is durably ACKed.
      QDL_STABLE_BAR_SETTLEMENT_DELAY_SECONDS: "0.10"
      QDL_STABLE_BAR_RETRY_INITIAL_SECONDS: "0.10"
      QDL_STABLE_BAR_RETRY_MAX_SECONDS: "1.0"
      QDL_STABLE_BAR_MAX_CONCURRENT_REQUESTS: "32"
      QDL_STABLE_BAR_STATE_PATH: ${QDL_STABLE_BAR_STATE_PATH:-/var/lib/qdl-stable/runtime/stable-crypto-bar-edge.json}
    volumes:
      - stable_state:/var/lib/qdl-stable
      - stable_tls:/stable-certs:ro
      - ${QDL_STABLE_RUNTIME_DIR:?set QDL_STABLE_RUNTIME_DIR}:/runtime:ro
    depends_on:
      stable_state_init: {condition: service_completed_successfully}
      stable_tls_init: {condition: service_completed_successfully}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}

