apiVersion: qdl/v2
kind: DataRequirement
metadata:
  id: alpha.vn.paper.stable
  owner: alpha-platform
  subject: spiffe://qdl/paper/alpha-vn-stable
  environment: paper
  revision: 1
spec:
  sdk_major: 2
  rollback_contract: V1
  execution_dependency: FORBIDDEN
  permissions:
  - instruments:read
  - snapshot:read
  - history:read
  - status:read
  - quality:read
  - stream:read
  purposes:
  - INTERNAL_ALPHA
  quotas:
    requests_per_minute: 180
    max_batch_items: 50
    max_warmup_rows: 2000
    max_streams: 20
    max_buffer_events: 2000
  requirements:
  - instrument_uid: d0ac3d4c-2374-5690-8af5-b970448f91d3
    feed: BAR
    consumer_grade: ALPHA
    source_policy_id: vn_primary_v2
    warmup_limit: 500
    max_freshness_ms: 180000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
    recovery: SNAPSHOT_AND_REPLAY
    bar_revision_policy: EMIT_REVISIONS
    interval: 1m
  - instrument_uid: d0ac3d4c-2374-5690-8af5-b970448f91d3
    feed: TRADE
    consumer_grade: ALPHA
    source_policy_id: vn_primary_v2
    warmup_limit: 0
    max_freshness_ms: 30000
    require_full_coverage: true
    require_final_bars: true
    stale_policy: BLOCK
    gap_policy: BLOCK
    recovery: SNAPSHOT_AND_REPLAY
    bar_revision_policy: LATEST
